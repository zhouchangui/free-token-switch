<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TokensBuddy 官网首屏视觉草案</title>
  <desc id="desc">深色技术工作台风格的官网首屏，展示 Provider 切换、好友分享和市场发布三条 Token 流动路径。</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F16"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#192330"/>
    </linearGradient>
    <linearGradient id="flow" x1="768" y1="568" x2="1370" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <circle cx="1325" cy="115" r="320" fill="#0A84FF" fill-opacity="0.12"/>
  <circle cx="1380" cy="830" r="300" fill="#10B981" fill-opacity="0.08"/>
  <g transform="translate(88 88)">
    <rect width="58" height="58" rx="14" fill="#121820" stroke="#314154"/>
    <path d="M17 23C28 6 56 13 49 36C42 58 11 48 22 28" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 38C36 57 8 49 16 27C23 7 52 16 41 34" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <text x="78" y="38" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="730">TokensBuddy</text>
  </g>
  <text x="96" y="284" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="800" letter-spacing="0">让闲置的 Token</text>
  <text x="96" y="382" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="800" letter-spacing="0">流动起来</text>
  <text x="100" y="455" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">面向 AI 编码工具的 Token 切换、分享</text>
  <text x="100" y="494" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">与交易工作台。每一步都可见、可控。</text>
  <rect x="100" y="560" width="220" height="58" rx="29" fill="#0A84FF"/>
  <text x="148" y="597" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">下载 TokensBuddy</text>
  <rect x="340" y="560" width="188" height="58" rx="29" fill="#17212D" stroke="#3F3F46"/>
  <text x="386" y="597" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="650">查看 GitHub</text>
  <g filter="url(#shadow)">
    <rect x="690" y="178" width="760" height="592" rx="38" fill="#141B24" stroke="#334155"/>
    <rect x="724" y="218" width="692" height="68" rx="22" fill="#1D2632"/>
    <text x="756" y="261" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Provider 流动控制台</text>
    <rect x="1186" y="236" width="170" height="32" rx="16" fill="#10B981" fill-opacity="0.16" stroke="#10B981"/>
    <text x="1215" y="258" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650">通道健康</text>
    <g>
      <rect x="742" y="330" width="200" height="132" rx="24" fill="#101820" stroke="#0A84FF"/>
      <text x="778" y="374" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">本地切换</text>
      <text x="778" y="410" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Claude / Codex</text>
    </g>
    <g>
      <rect x="1008" y="330" width="200" height="132" rx="24" fill="#101820" stroke="#F97366"/>
      <text x="1044" y="374" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">好友分享</text>
      <text x="1044" y="410" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">受控链接</text>
    </g>
    <g>
      <rect x="742" y="552" width="200" height="132" rx="24" fill="#101820" stroke="#F59E0B"/>
      <text x="778" y="596" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">市场发布</text>
      <text x="778" y="632" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">测试 / 上架</text>
    </g>
    <path d="M942 396C990 388 1018 388 1008 396" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
    <path d="M842 462C842 505 842 520 842 552" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
    <path d="M942 618C1092 618 1198 554 1275 468" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1275" cy="468" r="48" fill="#0F1720" stroke="#22D3EE" stroke-width="8"/>
    <text x="1240" y="475" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">流动</text>
  </g>
</svg>
