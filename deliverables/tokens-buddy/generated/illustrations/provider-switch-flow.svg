<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Provider / Token 切换流程</title>
  <desc id="desc">展示 TokensBuddy 如何在多个 AI 编码工具和 Provider 之间建立清晰可控的 Token 切换路径。</desc>
  <defs>
    <linearGradient id="line" x1="240" y1="360" x2="1160" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1440" height="720" rx="40" fill="#0F1720"/>
  <text x="88" y="94" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="740">把分散的 Provider 管清楚</text>
  <text x="88" y="138" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">从多个 AI 编码入口，到一个可见、可切换、可回退的 Token 控制台。</text>
  <path d="M240 360H1160" stroke="url(#line)" stroke-width="16" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="96" y="260" width="260" height="200" rx="28" fill="#181F2A" stroke="#3F3F46"/>
    <text x="136" y="314" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">AI 编码工具</text>
    <text x="136" y="360" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Claude</text>
    <text x="136" y="392" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Codex</text>
    <text x="136" y="424" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Gemini</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="232" width="260" height="256" rx="32" fill="#101820" stroke="#0A84FF" stroke-width="2"/>
    <circle cx="720" cy="318" r="44" fill="#0A84FF"/>
    <path d="M696 318H744M720 294V342" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <text x="646" y="400" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="740">TokensBuddy</text>
    <text x="640" y="434" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">切换 · 状态 · 回退</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1084" y="260" width="260" height="200" rx="28" fill="#181F2A" stroke="#3F3F46"/>
    <text x="1124" y="314" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Provider 池</text>
    <rect x="1124" y="344" width="152" height="28" rx="14" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF"/>
    <text x="1142" y="364" fill="#8CC8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">official</text>
    <rect x="1124" y="388" width="176" height="28" rx="14" fill="#10B981" fill-opacity="0.14" stroke="#10B981"/>
    <text x="1142" y="408" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">relay-ready</text>
  </g>
  <circle cx="420" cy="360" r="15" fill="#22D3EE"/>
  <circle cx="1020" cy="360" r="15" fill="#10B981"/>
</svg>
