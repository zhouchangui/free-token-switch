<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">好友分享流程</title>
  <desc id="desc">展示 TokensBuddy 如何把本地 Provider 变成受控分享通道，让好友使用而不裸发 Key。</desc>
  <defs>
    <linearGradient id="share" x1="250" y1="352" x2="1160" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F97366"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" rx="40" fill="#111820"/>
  <text x="88" y="96" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="740">不要裸发 Key，发一个受控分享通道</text>
  <text x="88" y="140" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">分享前可确认，分享后可停止，通道状态始终可见。</text>
  <path d="M258 352C430 252 548 252 720 352C892 452 1010 452 1182 352" stroke="url(#share)" stroke-width="16" stroke-linecap="round"/>
  <g>
    <rect x="96" y="252" width="280" height="210" rx="30" fill="#192330" stroke="#3F3F46"/>
    <text x="138" y="314" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="720">我的 Provider</text>
    <text x="138" y="356" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">本地代理 · Token 可用</text>
    <rect x="138" y="388" width="134" height="34" rx="17" fill="#10B981" fill-opacity="0.16" stroke="#10B981"/>
    <text x="158" y="411" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">通道健康</text>
  </g>
  <g>
    <rect x="580" y="220" width="280" height="264" rx="34" fill="#101820" stroke="#22D3EE" stroke-width="2"/>
    <text x="640" y="292" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="740">分享通道</text>
    <text x="636" y="332" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">链接 · 权限 · 停止</text>
    <rect x="630" y="370" width="180" height="42" rx="21" fill="#F97366" fill-opacity="0.16" stroke="#F97366"/>
    <text x="665" y="398" fill="#FDB0A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Token 搭子</text>
  </g>
  <g>
    <rect x="1064" y="252" width="280" height="210" rx="30" fill="#192330" stroke="#3F3F46"/>
    <text x="1114" y="314" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="720">好友使用</text>
    <text x="1114" y="356" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">导入链接 · 开始开发</text>
    <rect x="1114" y="388" width="160" height="34" rx="17" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF"/>
    <text x="1135" y="411" fill="#8CC8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">无需裸发 Key</text>
  </g>
</svg>
