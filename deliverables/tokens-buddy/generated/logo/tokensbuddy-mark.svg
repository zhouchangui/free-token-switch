    <circle cx="248" cy="376" r="24" fill="#22D3EE"/>
    <circle cx="776" cy="650" r="70" fill="#0F1720" stroke="#10B981" stroke-width="18"/>
    <circle cx="776" cy="650" r="24" fill="#10B981"/>
    <circle cx="774" cy="318" r="62" fill="#0F1720" stroke="#F97366" stroke-width="16"/>
    <circle cx="774" cy="318" r="22" fill="#F97366"/>
    <circle cx="318" cy="706" r="62" fill="#0F1720" stroke="#0A84FF" stroke-width="16"/>
    <circle cx="318" cy="706" r="22" fill="#0A84FF"/>
